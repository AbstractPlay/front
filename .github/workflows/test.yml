name: Test

on:
  pull_request:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: npm

      - name: Create .npmrc
        run: echo "@abstractplay:registry=https://npm.pkg.github.com/" > .npmrc

      - name: Add GitHub Packages auth
        run: echo "//npm.pkg.github.com/:_authToken=${{ secrets.PAT_READ_PACKAGES }}" >> .npmrc

      - name: Install NPM dependencies
        run: npm ci

      - name: Install pinned AP dependencies
        run: node bin/install-ap-deps.mjs --stage dev

      - name: Run tests
        run: npm run test:ci

      - name: Lint
        run: npm run lint
